<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>陳言星</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0908; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
#hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: 0.16em; color: rgba(245,240,232,0.3); text-transform: uppercase; pointer-events: none; animation: fade 4s ease forwards 1s; font-family: sans-serif; }
@keyframes fade { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">拖曳旋轉 · 點地板移動</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0908);
scene.fog = new THREE.FogExp2(0x0a0908, 0.018);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.set(0, 0, 0.1);

// ── FLOOR (concrete tile) ──
const tileCanvas = document.createElement('canvas');
tileCanvas.width = 512; tileCanvas.height = 512;
const tc = tileCanvas.getContext('2d');
tc.fillStyle = '#5a5a58'; tc.fillRect(0,0,512,512);
for(let i=0;i<8000;i++){const x=Math.random()*512,y=Math.random()*512,v=Math.floor(Math.random()*30)-15,c=90+v;tc.fillStyle=`rgba(${c},${c},${c-2},0.18)`;tc.fillRect(x,y,Math.random()*3+1,Math.random()*3+1);}
tc.strokeStyle='rgba(60,60,58,0.25)'; tc.lineWidth=2;
tc.beginPath();tc.moveTo(256,0);tc.lineTo(256,512);tc.stroke();
tc.beginPath();tc.moveTo(0,256);tc.lineTo(512,256);tc.stroke();
const tileTex = new THREE.CanvasTexture(tileCanvas);
tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;
tileTex.repeat.set(4,5);
const floorMat = new THREE.MeshStandardMaterial({ map: tileTex, roughness: 0.85, metalness: 0.05 });
const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 7), floorMat);
floor.position.set(0,-3,0); floor.receiveShadow = true; scene.add(floor);

// ── WALLS & CEILING ──
function wall(w,h,d,color,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:0.92,metalness:0.02}));
  m.position.set(x,y,z); m.receiveShadow=true; scene.add(m);
}
wall(10,0.1,7,0x1a1815,0,3,0);
wall(10,6,0.15,0x1e1c1a,0,0,-3.5);
wall(0.15,6,7,0x1c1a18,-5,0,0);
wall(0.15,6,7,0x1a1816,5,0,0);

// ── WINDOW (white metal, 2 panes) ──
const metalMat = new THREE.MeshStandardMaterial({color:0xe8e8e8,roughness:0.2,metalness:0.85});
const winW=2.4, winH=2.8, winZ=-3.5+0.12;
const mkBar=(w,h,d,x,y)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),metalMat);b.position.set(x,y,winZ);scene.add(b);};
mkBar(winW+0.14,0.08,0.1,2.0,winH/2+0.04);
mkBar(winW+0.14,0.08,0.1,2.0,-winH/2-0.04);
mkBar(0.08,winH+0.08,0.1,2.0-winW/2-0.04,0);
mkBar(0.08,winH+0.08,0.1,2.0+winW/2+0.04,0);
mkBar(0.05,winH,0.08,2.0,0);
const glassMat=new THREE.MeshStandardMaterial({color:0xc8dde8,roughness:0.0,metalness:0.1,transparent:true,opacity:0.12,side:THREE.DoubleSide});
const mkPane=(w,h,x)=>{const g=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat);g.position.set(x,0,winZ+0.01);scene.add(g);};
mkPane(winW/2-0.04,winH-0.06,2.0-winW/4);
mkPane(winW/2-0.04,winH-0.06,2.0+winW/4);
const winLight=new THREE.PointLight(0xc8dde8,0.6,6);
winLight.position.set(2.0,0.5,-3.2); scene.add(winLight);

// ── BED ──
const whiteMat=new THREE.MeshStandardMaterial({color:0xf0eeea,roughness:0.5,metalness:0.15});
const mattressMat=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.92});
function makeDotTex(){
  const dc=document.createElement('canvas');dc.width=256;dc.height=256;
  const ctx=dc.getContext('2d');ctx.fillStyle='#e8e2d8';ctx.fillRect(0,0,256,256);
  ctx.fillStyle='#a8a09a';
  for(let r=0;r<16;r++)for(let c=0;c<16;c++){ctx.beginPath();ctx.arc(c*16+8,r*16+8,1.8,0,Math.PI*2);ctx.fill();}
  const t=new THREE.CanvasTexture(dc);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,4);return t;
}
const dottedMat=new THREE.MeshStandardMaterial({map:makeDotTex(),roughness:0.95});
const bedPlatform=new THREE.Mesh(new THREE.BoxGeometry(3.8,0.16,3.08),whiteMat);
bedPlatform.position.set(2.9,-2.92,-2.8); scene.add(bedPlatform);
const legG2=new THREE.BoxGeometry(0.1,0.28,0.1);
[[4.45,-1.2],[4.45,-4.3],[2.75,-1.2],[2.75,-4.3]].forEach(([x,z])=>{
  const l=new THREE.Mesh(legG2,whiteMat);l.position.set(x,-3.14,z);scene.add(l);
});
const mattress=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.24,2.94),mattressMat);
mattress.position.set(2.9,-2.68,-2.8); scene.add(mattress);
const headboard=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.0,3.08),whiteMat);
headboard.position.set(4.88,-2.42,-2.8); scene.add(headboard);

// ── BEDDING ──
const creamMat=new THREE.MeshStandardMaterial({color:0xede8de,roughness:0.97});
const pillow1=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.15,1.4),creamMat);
pillow1.position.set(4.5,-2.48,-2.8); scene.add(pillow1);
const duvetMain=new THREE.Mesh(new THREE.BoxGeometry(3.0,0.15,2.6),creamMat);
duvetMain.position.set(2.4,-2.48,-2.9);duvetMain.rotation.y=0.03;scene.add(duvetMain);
const duvetFoot=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.18,0.35),creamMat);
duvetFoot.position.set(2.2,-2.45,-1.6);duvetFoot.rotation.y=0.05;scene.add(duvetFoot);

// ── BEDSIDE SHELF ──
const sMet=new THREE.MeshStandardMaterial({color:0xf0eeea,roughness:0.3,metalness:0.7});
const sBrd=new THREE.MeshStandardMaterial({color:0xf5f3ef,roughness:0.6});
const shelfG=new THREE.Group();
shelfG.rotation.y=Math.PI/2;
shelfG.position.set(4.82,0,-0.5);
scene.add(shelfG);
const sW=0.7,sH=1.8,sD=0.35,sT=0.025;
[[-sW/2+sT,-sD/2+sT],[-sW/2+sT,sD/2-sT],[sW/2-sT,-sD/2+sT],[sW/2-sT,sD/2-sT]].forEach(([ox,oz])=>{
  const p=new THREE.Mesh(new THREE.BoxGeometry(sT,sH,sT),sMet);p.position.set(ox,-3+sH/2,oz);shelfG.add(p);
});
[0.08,0.72,1.36].forEach(y=>{
  const b=new THREE.Mesh(new THREE.BoxGeometry(sW-sT*2,sT,sD-sT*2),sBrd);b.position.set(0,-3+y,0);shelfG.add(b);
  const fb=new THREE.Mesh(new THREE.BoxGeometry(sW,sT,sT),sMet);fb.position.set(0,-3+y,-sD/2+sT);shelfG.add(fb);
  const bb=new THREE.Mesh(new THREE.BoxGeometry(sW,sT,sT),sMet);bb.position.set(0,-3+y,sD/2-sT);shelfG.add(bb);
});
[-sW/2+sT,sW/2-sT].forEach(ox=>{
  const tb=new THREE.Mesh(new THREE.BoxGeometry(sT,sT,sD),sMet);tb.position.set(ox,-3+sH-sT,0);shelfG.add(tb);
});

// ── DOLLHOUSE ──
// Position: left+back wall corner, facing toward bookshelf (positive Z direction)
// Size: ~pillow size but taller
// left wall x=-5, back wall z=-3.5
// place at x=-4.0, z=-3.0, facing +Z (rotation y=0)

const dhG = new THREE.Group();
dhG.position.set(-3.2, -3, -2.4);
dhG.rotation.y = -Math.PI / 2 - Math.PI / 4; // -90 - 45deg
scene.add(dhG);

const dhPurple = new THREE.MeshStandardMaterial({color:0xc9a0e8, roughness:0.85});
const dhW2 = new THREE.MeshStandardMaterial({color:0xf0eeea, roughness:0.5, metalness:0.1});
const dhBlack = new THREE.MeshStandardMaterial({color:0x111018, roughness:0.9});
const dhRoofMat = new THREE.MeshStandardMaterial({color:0xe8e4de, roughness:0.75});

// dimensions: w=0.7, h=0.9, d=0.55 (short side longer)
const W=1.0, H=0.9, D=0.55;

// ── BODY ──
// floor 1
const b1 = new THREE.Mesh(new THREE.BoxGeometry(W, H/2, D), dhPurple);
b1.position.set(0, H/4, 0); dhG.add(b1);
// floor 2
const b2 = new THREE.Mesh(new THREE.BoxGeometry(W, H/2, D), dhPurple);
b2.position.set(0, H*3/4, 0); dhG.add(b2);
// floor divider strip
const div = new THREE.Mesh(new THREE.BoxGeometry(W+0.02, 0.025, D+0.02), dhW2);
div.position.set(0, H/2, 0); dhG.add(div);
// base strip
const base = new THREE.Mesh(new THREE.BoxGeometry(W+0.02, 0.025, D+0.02), dhW2);
base.position.set(0, 0.012, 0); dhG.add(base);
// corner trims (vertical white strips on front face)
[-W/2, W/2].forEach(x => {
  const trim = new THREE.Mesh(new THREE.BoxGeometry(0.03, H, 0.035), dhW2);
  trim.position.set(x, H/2, -D/2); dhG.add(trim);
});

// ── ROOF (pitched, symmetric) ──
const rH = 0.3;
const rW = W/2 + 0.12;
// left panel
const roofL = new THREE.Mesh(new THREE.BoxGeometry(rW, 0.04, D+0.14), dhRoofMat);
roofL.position.set(-rW*0.48, H + rH*0.38, 0);
roofL.rotation.z = 0.52;
dhG.add(roofL);
// right panel
const roofR = new THREE.Mesh(new THREE.BoxGeometry(rW, 0.04, D+0.14), dhRoofMat);
roofR.position.set(rW*0.48, H + rH*0.38, 0);
roofR.rotation.z = -0.52;
dhG.add(roofR);
// ridge cap
const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, D+0.16), dhW2);
ridge.position.set(0, H + rH - 0.01, 0); dhG.add(ridge);

// ── FRONT FACE (z = -D/2) ── facing +Z so front is at -D/2
const FZ = -D/2 - 0.008;

// helper: window - frame + 4 separate dark panes
function mkWin(x, y, w, h) {
  const p = 0.012; // divider thickness
  const g = 0.006; // gap between panes
  const pW = (w-p)/2 - g;
  const pH = (h-p)/2 - g;
  // white frame (outermost)
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+0.06, h+0.06, 0.04), dhW2);
  frame.position.set(x, y, FZ); dhG.add(frame);
  // 4 dark panes
  [[-1,1],[ 1,1],[-1,-1],[ 1,-1]].forEach(([sx,sy]) => {
    const pane = new THREE.Mesh(new THREE.BoxGeometry(pW, pH, 0.042), dhBlack);
    pane.position.set(x + sx*(pW/2+p/2), y + sy*(pH/2+p/2), FZ+0.001);
    dhG.add(pane);
  });
  // H divider
  const hbar = new THREE.Mesh(new THREE.BoxGeometry(w, p, 0.044), dhW2);
  hbar.position.set(x, y, FZ+0.002); dhG.add(hbar);
  // V divider
  const vbar = new THREE.Mesh(new THREE.BoxGeometry(p, h, 0.044), dhW2);
  vbar.position.set(x, y, FZ+0.002); dhG.add(vbar);
}

// FLOOR 2: two windows
mkWin(-W*0.22, H*0.78, 0.18, 0.2);
mkWin( W*0.22, H*0.78, 0.18, 0.2);

// FLOOR 1 LEFT: arched door
const dCX=-W*0.2, dCY=H*0.25, dW=0.13, dH2=0.26;
const dg=new THREE.Mesh(new THREE.BoxGeometry(dW,dH2,0.025),dhBlack);
dg.position.set(dCX,dCY,FZ); dhG.add(dg);
const dfr=new THREE.Mesh(new THREE.BoxGeometry(dW+0.055,dH2+0.04,0.02),dhW2);
dfr.position.set(dCX,dCY,FZ+0.006); dhG.add(dfr);
const dg2=new THREE.Mesh(new THREE.BoxGeometry(dW,dH2,0.025),dhBlack);
dg2.position.set(dCX,dCY,FZ+0.014); dhG.add(dg2);
// arch top
const archM=new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.065,0.02,10,1,false,0,Math.PI),dhW2);
archM.rotation.z=Math.PI/2; archM.rotation.y=Math.PI/2;
archM.position.set(dCX, dCY+dH2/2+0.03, FZ+0.006); dhG.add(archM);
const archG2=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.025,10,1,false,0,Math.PI),dhBlack);
archG2.rotation.z=Math.PI/2; archG2.rotation.y=Math.PI/2;
archG2.position.set(dCX, dCY+dH2/2+0.03, FZ+0.016); dhG.add(archG2);
// door 2x2 grid
const dhbar = new THREE.Mesh(new THREE.BoxGeometry(dW, 0.025, 0.025), dhW2);
dhbar.position.set(dCX, dCY, FZ+0.038); dhG.add(dhbar);
const dvbar = new THREE.Mesh(new THREE.BoxGeometry(0.025, dH2, 0.025), dhW2);
dvbar.position.set(dCX, dCY, FZ+0.038); dhG.add(dvbar);
// knob
const knob=new THREE.Mesh(new THREE.SphereGeometry(0.01,6,6),dhW2);
knob.position.set(dCX+0.05, dCY, FZ+0.028); dhG.add(knob);

// FLOOR 1 RIGHT: one window
mkWin(W*0.22, H*0.25, 0.18, 0.2);

// ── BOOKSHELVES ──
const swMat=new THREE.MeshStandardMaterial({color:0x3d2010,roughness:0.85,metalness:0.02});
const slMat=new THREE.MeshStandardMaterial({color:0x5c3418,roughness:0.82,metalness:0.02});
function makeOpenShelf(cx,cz){
  const w=2.0,h=2.2,d=0.48,t=0.055;const by=-3;
  const lp=new THREE.Mesh(new THREE.BoxGeometry(t,h,d),swMat);lp.position.set(cx-w/2+t/2,by+h/2,cz);scene.add(lp);
  const rp=new THREE.Mesh(new THREE.BoxGeometry(t,h,d),swMat);rp.position.set(cx+w/2-t/2,by+h/2,cz);scene.add(rp);
  const bp=new THREE.Mesh(new THREE.BoxGeometry(w,h,t),swMat);bp.position.set(cx,by+h/2,cz+d/2-t/2);scene.add(bp);
  const btm=new THREE.Mesh(new THREE.BoxGeometry(w-t*2,t,d),slMat);btm.position.set(cx,by+t/2,cz);scene.add(btm);
  const top=new THREE.Mesh(new THREE.BoxGeometry(w+0.02,t,d+0.02),slMat);top.position.set(cx,by+h-t/2,cz);scene.add(top);
  [h/3,h*2/3].forEach(yOff=>{const shelf=new THREE.Mesh(new THREE.BoxGeometry(w-t*2,t,d-0.02),new THREE.MeshStandardMaterial({color:0x5c3418,roughness:0.82}));shelf.position.set(cx,by+yOff,cz);scene.add(shelf);});
}
makeOpenShelf(3.95,3.2);
makeOpenShelf(1.9,3.2);

// ── CEILING LAMP ──
const lampMat=new THREE.MeshStandardMaterial({color:0x2a2418,roughness:0.8});
const cord=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.7,6),lampMat);cord.position.set(0,2.65,0);scene.add(cord);
const shade=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.16,0.22,12,1,true),new THREE.MeshStandardMaterial({color:0x282018,side:THREE.DoubleSide,roughness:0.8}));shade.position.set(0,2.25,0);scene.add(shade);
const bulbMat=new THREE.MeshStandardMaterial({color:0xfff5d0,emissive:0xffd070,emissiveIntensity:2.0});
const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8),bulbMat);bulb.position.set(0,2.28,0);scene.add(bulb);

// ── LIGHTS ──
scene.add(new THREE.AmbientLight(0x2a2418,0.45));
const mainLight=new THREE.PointLight(0xfff5d0,2.8,14);
mainLight.position.set(0,2.25,0);mainLight.castShadow=true;mainLight.shadow.mapSize.set(512,512);scene.add(mainLight);

// ── CLICK TO MOVE ──
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let targetPos=null;
function onTap(clientX,clientY){
  const rect=canvas.getBoundingClientRect();
  pointer.x=((clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),3);
  const hit=new THREE.Vector3();
  raycaster.ray.intersectPlane(floorPlane,hit);
  if(hit){
    hit.x=Math.max(-4.4,Math.min(4.4,hit.x));
    hit.z=Math.max(-3.0,Math.min(3.0,hit.z));
    targetPos=new THREE.Vector3(hit.x,0,hit.z);
  }
}
canvas.addEventListener('dblclick',e=>onTap(e.clientX,e.clientY));
let touchStartX=0,touchStartY=0,lastTapTime=0,lastTapX=0,lastTapY=0;
canvas.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  const dx=Math.abs(t.clientX-touchStartX),dy=Math.abs(t.clientY-touchStartY);
  const now=Date.now();
  // only count as tap if didn't drag
  if(dx<12&&dy<12){
    const tapDx=Math.abs(t.clientX-lastTapX),tapDy=Math.abs(t.clientY-lastTapY);
    const timeSinceLast=now-lastTapTime;
    // double tap: two taps within 350ms at same spot
    if(timeSinceLast<350&&tapDx<20&&tapDy<20){
      onTap(t.clientX,t.clientY);
      lastTapTime=0;
    } else {
      lastTapTime=now;lastTapX=t.clientX;lastTapY=t.clientY;
    }
  }
},{passive:true});

// ── CONTROLS ──
let isDragging=false,prevX=0,prevY=0,yaw=0,pitch=0,targetYaw=0,targetPitch=0;
const keys={};
canvas.addEventListener('mousedown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY;});
window.addEventListener('mouseup',()=>isDragging=false);
window.addEventListener('mousemove',e=>{if(!isDragging)return;targetYaw-=(e.clientX-prevX)*0.004;targetPitch-=(e.clientY-prevY)*0.003;targetPitch=Math.max(-0.5,Math.min(0.5,targetPitch));prevX=e.clientX;prevY=e.clientY;});
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let lookPrevX=0,lookPrevY=0,lookActive=false;
canvas.addEventListener('touchstart',e=>{lookActive=true;lookPrevX=e.touches[0].clientX;lookPrevY=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!lookActive)return;
  const t=e.touches[0];
  targetYaw-=(t.clientX-lookPrevX)*0.004;
  targetPitch-=(t.clientY-lookPrevY)*0.003;
  targetPitch=Math.max(-0.5,Math.min(0.5,targetPitch));
  lookPrevX=t.clientX;lookPrevY=t.clientY;
},{passive:true});
canvas.addEventListener('touchend',e=>{lookActive=false;},{passive:true});

window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});

// ── LOOP ──
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  clock.getDelta();
  const t=clock.getElapsedTime();
  const speed=0.055;
  yaw+=(targetYaw-yaw)*0.1;pitch+=(targetPitch-pitch)*0.1;
  const fwd=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
  if(keys['w']||keys['arrowup'])camera.position.addScaledVector(fwd,speed);
  if(keys['s']||keys['arrowdown'])camera.position.addScaledVector(fwd,-speed);
  if(keys['a']||keys['arrowleft'])camera.position.addScaledVector(right,-speed);
  if(keys['d']||keys['arrowright'])camera.position.addScaledVector(right,speed);
  if(targetPos){
    const diff=targetPos.clone().sub(new THREE.Vector3(camera.position.x,0,camera.position.z));
    if(diff.length()<0.05){targetPos=null;}
    else{diff.normalize().multiplyScalar(speed*1.5);camera.position.x+=diff.x;camera.position.z+=diff.z;}
  }
  camera.position.x=Math.max(-4.4,Math.min(4.4,camera.position.x));
  camera.position.z=Math.max(-3.2,Math.min(3.2,camera.position.z));
  camera.position.y=0;
  camera.lookAt(camera.position.clone().add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch))));
  mainLight.intensity=2.8+Math.sin(t*0.8)*0.08;
  bulbMat.emissiveIntensity=2.0+Math.sin(t*0.8)*0.15;
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
